[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ugclient-core"
version = "0.3.0"
description = "UGClient computation sidecar (kinematics / dynamics over JSON-RPC WebSocket)"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Daniel Wang"}]
# ufactory_genesis is NOT listed here: upstream only supports a source checkout
# + `pip install -e .`. scripts/fetch_ufg.py clones it at the pinned commit below.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "websockets>=13,<16",
    "pin==4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
ugclient-core = "ugclient_core.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ugclient_core*"]

[tool.ugclient.ufactory_genesis]
repository = "https://github.com/xArm-Developer/ufactory_genesis.git"
# Pinned commit (design doc §9): be49519 carries the official UFACTORY maximum joint torques.
commit = "be49519"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
