[package]
name = "ugclient"
version = "0.3.0"
description = "UGClient - kinematics/dynamics desktop client for UFACTORY arms (personal project, not an official UFACTORY product)"
authors = ["Daniel Wang"]
license = "MIT"
repository = "https://github.com/DanielWang123321/ugclient"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ugclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
