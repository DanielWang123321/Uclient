name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2 file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/fetch_ufg.py
          python -m pip install -e third_party/ufactory_genesis -e "core[dev]"
          python scripts/build_sidecar.py
          python scripts/sync_assets.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/dist-sidecar/uclient-core/_internal:$GITHUB_WORKSPACE/dist-sidecar/uclient-core/_internal/cmeel.prefix/lib"
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json
      - name: Draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          sha256sum appimage/*.AppImage deb/*.deb > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" --draft --title "Uclient ${GITHUB_REF_NAME}" \
            --notes "Personal project in development; not an official UFACTORY product. Linux x64 only." \
            appimage/*.AppImage deb/*.deb SHA256SUMS.txt
