name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  core:
    name: Sidecar tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Fetch pinned ufactory_genesis
        run: python scripts/fetch_ufg.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e third_party/ufactory_genesis -e "core[dev]"
      - name: Lint
        working-directory: core
        run: ruff check . && ruff format --check .
      - name: Tests (incl. U1 golden case)
        working-directory: core
        run: python -m pytest -q

  core-windows:
    # PyPI has no Windows wheel for pin==4.0.0 (design doc risk R3), so this job takes
    # Pinocchio from conda-forge. Experimental until the M5 Windows milestone.
    name: Sidecar tests (Windows, experimental)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
      - name: Install
        run: |
          conda install -y pinocchio=4.0.0 numpy pyyaml "websockets>=13,<16" pytest
          python scripts/fetch_ufg.py
          python -m pip install --no-deps -e third_party/ufactory_genesis -e core
      - name: Tests (incl. U1 golden case)
        working-directory: core
        run: python -m pytest -q

  frontend:
    name: Frontend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
        if: runner.os == 'Linux'
      - run: pnpm test
      - run: pnpm build
        if: runner.os == 'Linux'

  shell:
    name: Tauri shell (Rust)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder frontend dist
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  package-linux:
    name: Package Linux (deb)
    needs: [core, frontend, shell]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sidecar (PyInstaller onedir) + smoke test (U1 golden)
        run: |
          python scripts/fetch_ufg.py
          python -m pip install --upgrade pip
          python -m pip install -e third_party/ufactory_genesis -e "core[dev]"
          python scripts/build_sidecar.py
          python scripts/sync_assets.py
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json
      - name: Sizes and checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          ls -la deb
          sha256sum deb/*.deb | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ugclient-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
